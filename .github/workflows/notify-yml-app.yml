name: Notify YML_app after data updates

on:
  workflow_run:
    workflows:
      - Fetch from products.json endpoints
      - Sync config/ to data branch
    types:
      - completed
  workflow_dispatch:

jobs:
  notify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      YML_APP_DISPATCH_TOKEN: ${{ secrets.YML_APP_DISPATCH_TOKEN }}

    steps:
      - name: Preflight (ensure token configured)
        run: |
          if [ -z "${YML_APP_DISPATCH_TOKEN}" ] && [ -z "${PAT_TOKEN}" ]; then
            echo "Missing required token." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Set YML_APP_DISPATCH_TOKEN (recommended) or PAT_TOKEN with access to the YML_app repo." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Dispatch to YML_app
        uses: actions/github-script@v7
        env:
          TARGET_OWNER: ${{ vars.YML_APP_OWNER || github.repository_owner }}
          TARGET_REPO: ${{ vars.YML_APP_REPO || 'YML_app' }}
        with:
          github-token: ${{ env.YML_APP_DISPATCH_TOKEN != '' && env.YML_APP_DISPATCH_TOKEN || env.PAT_TOKEN }}
          script: |
            const owner = process.env.TARGET_OWNER;
            const repo = process.env.TARGET_REPO;

            const run = context.payload.workflow_run;
            const workflowName = run?.name ?? '(manual)';

            let eventType = 'yml-repo-updated';
            if (workflowName === 'Sync config/ to data branch') eventType = 'yml-config-updated';
            if (workflowName === 'Fetch from products.json endpoints') eventType = 'yml-data-updated';

            const payload = {
              source_repo: process.env.GITHUB_REPOSITORY,
              source_ref: process.env.GITHUB_REF,
              source_sha: process.env.GITHUB_SHA,
              data_branch: 'data',
              workflow: {
                name: workflowName,
                conclusion: run?.conclusion ?? null,
                run_id: run?.id ?? null,
                run_number: run?.run_number ?? null,
                html_url: run?.html_url ?? null,
              },
            };

            await github.request('POST /repos/{owner}/{repo}/dispatches', {
              owner,
              repo,
              event_type: eventType,
              client_payload: payload,
            });

            core.summary.addHeading('✅ Dispatched to YML_app');
            core.summary.addList([
              `Target: ${owner}/${repo}`,
              `Event: ${eventType}`,
              `Source: ${payload.source_repo}@${payload.source_sha}`,
              `Workflow: ${payload.workflow.name}`,
            ]);
            await core.summary.write();
